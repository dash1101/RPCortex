[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpctool"
version = "1.0.0"
description = "Drive an RPCortex v2 device from a computer over its USB serial console"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
rpc = "rpctool.cli:main"
rpc-tui = "rpctool.tui:main"

[tool.setuptools]
packages = ["rpctool", "rpctool.tui"]
